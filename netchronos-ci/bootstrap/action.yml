name: Bootstrap verified NetChronos
description: Reconstruct the checksum-pinned bundle, install dependencies, verify protocol, and apply semantics-preserving CI compatibility patches
runs:
  using: composite
  steps:
    - name: Reconstruct checksum-pinned research bundle
      shell: bash
      run: bash netchronos-ci/reconstruct_bundle.sh
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: target-run/netchronos/requirements.txt
    - name: Install Python dependencies
      shell: bash
      working-directory: target-run/netchronos
      run: pip install -r requirements.txt
    - name: Verify frozen protocol before compatibility patches
      shell: bash
      working-directory: target-run/netchronos
      run: python scripts/verify_protocol.py
    - name: Apply fail-closed predicate-pushdown patch
      shell: bash
      working-directory: target-run/netchronos
      run: python ../../netchronos-ci/patch_memory_loaders.py
    - name: Apply fail-closed Psycopg DDL transaction-boundary patch
      shell: bash
      working-directory: target-run/netchronos
      run: python ../../netchronos-ci/patch_db_transactions.py
    - name: Enforce TimescaleDB-legal physical designs
      shell: bash
      working-directory: target-run/netchronos
      run: python ../../netchronos-ci/patch_design_legality.py
    - name: Use TimescaleDB-supported hypertable index creation
      shell: bash
      working-directory: target-run/netchronos
      run: python ../../netchronos-ci/patch_hypertable_indexes.py
    - name: Run continuous-aggregate refresh outside transactions
      shell: bash
      working-directory: target-run/netchronos
      run: python ../../netchronos-ci/patch_cagg_autocommit.py
