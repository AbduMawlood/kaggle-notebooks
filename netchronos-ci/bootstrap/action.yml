name: Bootstrap verified NetChronos
summary: Reconstruct the checksum-pinned bundle, install Python dependencies, and verify the frozen protocol
runs:
  using: composite
  steps:
    - name: Reconstruct checksum-pinned research bundle
      shell: bash
      run: bash netchronos-ci/reconstruct_bundle.sh
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: target-run/netchronos/requirements.txt
    - name: Install Python dependencies
      shell: bash
      working-directory: target-run/netchronos
      run: pip install -r requirements.txt
    - name: Verify frozen protocol
      shell: bash
      working-directory: target-run/netchronos
      run: python scripts/verify_protocol.py
